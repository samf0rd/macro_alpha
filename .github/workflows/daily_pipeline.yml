name: Daily Macro-Alpha Pipeline

on:
  schedule:
    # Runs at 22:14 UTC Monday-Friday
    # This aligns perfectly with 5:14 PM EST (1 hour after US market close)
    # and 10:14 PM WET, capturing the full daily trading session.
    - cron: '14 22 * * 1-5'
  workflow_dispatch: # Allows manual clicking of a "Run Workflow" button in GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants the bot permission to push data back to the repo

    steps:
      - name: 📥 Checkout Repository   
        uses: actions/checkout@v4 # The server downloads a copy of your code so it has access to src/data_pipeline.py  

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5 # The server installs Python.
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install Dependencies # The server reads your requirements.txt and installs pandas, xgboost, yfinance, etc
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 
        
      - name: 🔄 Run Data Harvester (Yahoo/FRED)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python src/data_pipeline.py
        # This is where the magic happens. The server runs your Python scripts exactly like you did on your laptop. 
        # It pulls the latest market close data and calculates the new moving averages and macro lags.
      - name: ⚙️ Run Feature Engineering
        run: python src/feature_engineering.py

      - name: 💾 Commit and Push Updated Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/market_macro_data.parquet data/processed/inference_ready_features.parquet
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update: Market Data & ML Features" && git push)
          
        # The scripts have successfully generated updated .parquet files, but right now, they only exist on this temporary server (which is about to self-destruct).
        # This step configures a fake "bot" user, adds the two modified parquet files, commits them, and pushes them back to your main repository
        # Check if the files actually changed. If they didn't (e.g., it was a market holiday), just stop and do nothing. If they did change, commit them